<!DOCTYPE html>
<html>
<head>
    
    <title>Job Application</title>
</head>
<body>
    <h1>Job Application Form</h1>
    <form>
        <label for="fullName">Full Name:</label><br>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"><br><br>

        <label for="position">Position Applying For:</label><br>
        <select id="position" name="position">
            <option value="">Select a position</option>
            <option value="frontend">Frontend Developer</option>
            <option value="backend">Backend Developer</option>
            
        </select><br><br>

        <label for="experience">Years of Experience:</label><br>
        <input type="number" id="experience" name="experience" min="0" max="30"><br><br>

        <label for="message">Why do you want to join us?</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="Write a short message..."></textarea><br><br>

        <label>
            <input type="checkbox" name="terms"> I agree to the terms and conditions.
        </label><br><br>

        <button type="submit">Submit Application</button>
        <button type="reset">Reset</button>
        <button type="button">Save Draft</button>
    </form>
</body>
</html>
