<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduation Student Application</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef7ff, #e3ecff);
            margin: 0;
            padding: 40px 20px;
            color: #11263f;
        }

        .form-container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #123d7a;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            margin-bottom: 25px;
            color: #4b5563;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #1f2937;
        }

        input, select, textarea, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .checkbox-row input {
            width: auto;
            margin: 0;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Graduation Student Application</h1>
        <p class="intro">Please complete the form below to apply for graduation-related support and opportunities.</p>

        <form id="studentForm" action="#">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required minlength="3">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required minlength="10">

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" placeholder="Age must be 18 or above" min="18" required>

            <label for="program">Program / Course:</label>
            <select id="program" name="program" required>
                <option value="">Select your program</option>
                <option value="BSc Computer Science">BSc Computer Science</option>
                <option value="BBA">BBA</option>
                <option value="BCom">BCom</option>
                <option value="B.A. English">B.A. English</option>
                <option value="Engineering">Engineering</option>
                <option value="Other">Other</option>
            </select>

            <label for="graduationYear">Expected Graduation Year:</label>
            <select id="graduationYear" name="graduationYear" required>
                <option value="">Select year</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
            </select>

            <label for="college">College / University:</label>
            <input type="text" id="college" name="college" placeholder="Enter your college name" required>

            <label for="cgpa">CGPA:</label>
            <input type="number" id="cgpa" name="cgpa" min="0" max="10" step="0.01" placeholder="Enter your CGPA" required>

            <label for="message">Final Year Project / Graduation Details:</label>
            <textarea id="message" name="message" placeholder="Describe your graduation project, interests, or achievements"></textarea>

            <label class="checkbox-row">
                <input type="checkbox" name="terms" required> I confirm that the information provided is correct.
            </label>

            <button type="submit">Submit Graduation Application</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('studentForm');
        const dobInput = document.getElementById('dob');
        const ageInput = document.getElementById('age');

        function calculateAge(dateString) {
            const birthDate = new Date(dateString);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();

            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }

            return age;
        }

        dobInput.addEventListener('change', function () {
            if (this.value) {
                const age = calculateAge(this.value);
                ageInput.value = age;

                if (age < 18) {
                    ageInput.setCustomValidity('Age must be greater than 18.');
                } else {
                    ageInput.setCustomValidity('');
                }
            }
        });

        form.addEventListener('submit', function (event) {
            const age = Number(ageInput.value);

            if (age < 18) {
                event.preventDefault();
                ageInput.setCustomValidity('Age must be greater than 18.');
                ageInput.reportValidity();
            }
        });
    </script>
</body>
</html>
