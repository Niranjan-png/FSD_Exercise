<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Table</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px;
            background-color: purple;
            color: white;
            border: none;
        }

        #table {
            margin-top: 20px;
            font-size: 20px;
            line-height: 1.8;
            
        }
    </style>
</head>

<body>

    <h1>Multiplication Table</h1>

    <input type="number" id="number"
           placeholder="Enter number">

    <button onclick="generateTable()">
        Generate
    </button>

    <div id="table"></div>

    <script>

        function generateTable() {

            let number =
                Number(document.getElementById("number").value);

            let output = "";

            for (let i = 1; i <= 10; i++) {

                output +=
                    `${number} × ${i} = ${number * i}<br>`;
            }

            document.getElementById("table").innerHTML =
                output;
        }

    </script>

</body>
</html>
